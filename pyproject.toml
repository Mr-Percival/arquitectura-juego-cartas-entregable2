[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juegocartas"
version = "0.0.2"
description = "Sistema Digital de Juego de Cartas - microkernel: núcleo + plug-ins de reglas"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "PyTestArch>=5", "radon>=6", "psycopg[binary]>=3.1", "pgserver>=0.1"]

# Plug-ins de referencia. El núcleo los descubre por este grupo de entry points (ADR-03):
# una variante nueva (p. ej. Continental) se publica como otra distribución que declara
# su propia entrada en este grupo, sin modificar ni recompilar el núcleo.
[project.entry-points."juegocartas.variantes"]
CLASICA_433 = "juegocartas.plugins.clasica:ReglaClasicaPlugin"
APUNTADO_101 = "juegocartas.plugins.apuntado:ReglaApuntadoPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
